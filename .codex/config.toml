# Research project permissions

default_permissions = "Research"
approval_policy = "on-request"
approvals_reviewer = "user"

[permissions.Research]
description = "Research Restricted Coding Environment"
extends = ":workspace"

[permissions.Research.filesystem]
":root" = "deny"
":minimal" = "read"

[permissions.Research.filesystem.":workspace_roots"]
"." = "write"

# Protected Research files
"proposal.md" = "read"
"AGENTS.md" = "read"
"tasks" = "read"
"tests" = "read"
"data/raw" = "read"

# Deny access to credentials
".env" = "deny"
"**/*.env" = "deny"
"*.key" = "deny"

[permissions.Research.network]
enabled = false